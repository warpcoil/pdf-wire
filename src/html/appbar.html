    <span class="phase">Test build 6</span>
  </button>
  <nav class="modes" aria-label="Mode">
    <button type="button" class="modetab" id="modeWrite" aria-pressed="false">Write</button>
    <button type="button" class="modetab" id="modePages" aria-pressed="false">Pages</button>
    <button type="button" class="modetab" id="modeCheck" aria-pressed="false">Check</button>
    <button type="button" class="modetab" id="modeRemediate" aria-pressed="false">Remediate</button>
  </nav>
  <span class="filename" id="fileName">No file open</span>
  <span class="chipnote only-author" id="saveChip"></span>
  <span class="chipnote warnchip only-retag">Tag in place · experimental</span>
  <div class="bar-actions">
    <button type="button" class="btn dark" id="newBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h7l3 3v11H5z"/><path d="M10 9v5M7.5 11.5h5"/></svg>New</button>
    <span class="btn dark file-btn">
      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h3.6l1.8 2h5.6A1.5 1.5 0 0 1 17 8.5v6a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z"/></svg>
      <span aria-hidden="true">Open</span>
      <input type="file" id="fileInput" accept="application/pdf,.pdf,.pwj,application/json,.json" aria-label="Open a PDF or a .pwj draft">
    </span>
    <button type="button" class="btn primary only-audit" id="reportBtn" disabled>Accessibility report</button>
    <button type="button" class="btn dark only-author" id="saveDraftBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h9.5L16 6.5V16H4z"/><path d="M7 4v4h6V4"/><path d="M7 16v-5h6v5"/></svg>Save draft</button>
    <button type="button" class="btn primary only-author" id="exportBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10"/><path d="M6 7l4-4 4 4"/><path d="M4 13v3h12v-3"/></svg>Check &amp; export</button>
    <button type="button" class="btn dark only-retag" id="rtCancel">Close</button>
    <button type="button" class="btn primary only-retag" id="rtWrite"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10"/><path d="M6 7l4-4 4 4"/><path d="M4 13v3h12v-3"/></svg>Write tagged PDF</button>
  </div>
  <input type="file" id="checkInput" accept="application/pdf,.pdf" hidden>
  <input type="file" id="remInput" accept="application/pdf,.pdf" hidden>
</header>

<!-- Check: viewing an existing PDF's tags -->
<div class="toolbar only-audit" role="toolbar" aria-label="Check tools">
  <div class="tbgroup" role="group" aria-labelledby="tgPageLbl">
    <div class="tbrow">
      <button type="button" class="iconbtn" id="prevPage" aria-label="Previous page" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 6l-4 4 4 4"/></svg></button>
      <span class="num" id="pageLabel" aria-live="polite">Page – of –</span>
      <button type="button" class="iconbtn" id="nextPage" aria-label="Next page" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 6l4 4-4 4"/></svg></button>
    </div>
    <span class="tblabel" id="tgPageLbl">Page</span>
  </div>
  <div class="tbgroup" role="group" aria-labelledby="tgZoomLbl">
    <div class="tbrow">
      <button type="button" class="iconbtn" id="zoomOut" aria-label="Zoom out" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg></button>
      <span class="num" id="zoomLabel" style="min-width:48px;text-align:center">100%</span>
      <button type="button" class="iconbtn" id="zoomIn" aria-label="Zoom in" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/><path d="M10 5v10"/></svg></button>
      <button type="button" class="btn link" id="zoomFit" disabled>Fit width</button>
    </div>
    <span class="tblabel" id="tgZoomLbl">Zoom</span>
  </div>
  <div class="tbgroup" role="group" aria-labelledby="tgShowLbl">
    <div class="tbrow">
      <label class="tgchk"><input type="checkbox" id="showTags" checked><span>Tags</span></label>
      <label class="tgchk"><input type="checkbox" id="showOrder" checked><span>Reading order</span></label>
      <label class="tgchk"><input type="checkbox" id="showUntagged" checked><span>Untagged content</span></label>
    </div>
    <span class="tblabel" id="tgShowLbl">Show</span>
  </div>
  <div class="tbgroup tbend" role="group" aria-label="This PDF">
    <div class="tbrow">
      <button type="button" class="btn dark" id="backToEdit" hidden>Back to editing</button>
      <button type="button" class="btn dark" id="backToRetag" hidden>Back to tagging</button>
      <button type="button" class="btn dark" id="sampleBtn">Open sample PDF</button>
      <button type="button" class="btn primary" id="remediateBtn">Remediate this PDF</button>
    </div>
  </div>
</div>

<!-- Remediate: tag in place -->
<div class="toolbar only-retag" role="toolbar" aria-label="Tag tools">
  <div class="tbgroup" role="group" aria-labelledby="rgHistLbl">
    <div class="tbrow">
      <button type="button" class="tb" id="rtUndo" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5L3 9l4 4"/><path d="M3 9h9a5 5 0 0 1 0 10h-2"/></svg>Undo</button>
      <button type="button" class="tb" id="rtRedo" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 5l4 4-4 4"/><path d="M17 9H8a5 5 0 0 0 0 10h2"/></svg>Redo</button>
    </div>
    <span class="tblabel" id="rgHistLbl">History</span>
  </div>
  <div class="tbgroup" role="group" aria-labelledby="rgTagLbl">
    <div class="tbrow" id="rtTagAs">
      <button type="button" class="tagbtn" data-role="H1">H1</button>
      <button type="button" class="tagbtn" data-role="H2">H2</button>
      <button type="button" class="tagbtn" data-role="H3">H3</button>
      <label for="rtTagMore" class="sr-only">More heading levels</label>
      <select id="rtTagMore" class="tagsel"><option value="">H4–H6</option><option value="H4">H4</option><option value="H5">H5</option><option value="H6">H6</option></select>
      <button type="button" class="tagbtn" data-role="P">P</button>
      <button type="button" class="tagbtn" data-role="L">List</button>
      <button type="button" class="tagbtn" data-role="Table">Table</button>
      <button type="button" class="tagbtn" data-role="Figure">Figure</button>
      <button type="button" class="tagbtn art" data-role="Artifact">Artifact</button>
    </div>
    <span class="tblabel" id="rgTagLbl">Tag as</span>
  </div>
  <div class="tbgroup" role="group" aria-labelledby="rgArrLbl">
    <div class="tbrow">
      <button type="button" class="tb" id="rtCombineBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h12"/><path d="M4 16h12"/><path d="M10 6v8"/><path d="M7 11l3 3 3-3"/></svg>Combine</button>
      <button type="button" class="tb" id="rtSplitBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/><path d="M10 3v4M10 13v4"/><path d="M7 5l3-2 3 2M7 15l3 2 3-2"/></svg>Split</button>
      <button type="button" class="tb" id="rtUpBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4"/><path d="M5 9l5-5 5 5"/></svg>Move up</button>
      <button type="button" class="tb" id="rtDownBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12"/><path d="M5 11l5 5 5-5"/></svg>Move down</button>
    </div>
    <span class="tblabel" id="rgArrLbl">Arrange</span>
  </div>
  <div class="tbgroup" role="group" aria-labelledby="rgImgLbl">
    <div class="tbrow">
      <button type="button" class="tb" id="rtDescribe"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="1.5"/><circle cx="7.5" cy="8.5" r="1.5"/><path d="M3.5 14.5l4-4 3 3 2-2 4 4"/></svg>Describe</button>
    </div>
    <span class="tblabel" id="rgImgLbl">Images</span>
  </div>
  <div class="tbgroup" role="group" aria-labelledby="rgViewLbl">
    <div class="tbrow">
      <button type="button" class="iconbtn" id="rtPrev" aria-label="Previous page" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 6l-4 4 4 4"/></svg></button>
      <span class="num" id="rtPageLabel" aria-live="polite">Page – of –</span>
      <button type="button" class="iconbtn" id="rtNext" aria-label="Next page" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 6l4 4-4 4"/></svg></button>
      <button type="button" class="iconbtn" id="rtZoomOut" aria-label="Zoom out"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg></button>
      <span class="num" id="rtZoomLabel" style="min-width:44px;text-align:center">100%</span>
      <button type="button" class="iconbtn" id="rtZoomIn" aria-label="Zoom in"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/><path d="M10 5v10"/></svg></button>
      <label class="tgchk"><input type="checkbox" id="rtShowTags" checked><span>Tags</span></label>
      <label class="tgchk"><input type="checkbox" id="rtShowOrder" checked><span>Order</span></label>
      <label class="tgchk"><input type="checkbox" id="rtShowArt" checked><span>Artifacts</span></label>
    </div>
    <span class="tblabel" id="rgViewLbl">View</span>
  </div>
  <div class="tbgroup tbend" role="group" aria-labelledby="rgLayLbl">
    <div class="seg2" id="rtLayout">
      <button type="button" data-layout="original" aria-pressed="false">Original</button>
      <button type="button" data-layout="tagged" aria-pressed="false">Tagged</button>
      <button type="button" data-layout="both" aria-pressed="true">Side by side</button>
    </div>
    <span class="tblabel" id="rgLayLbl">Layout</span>
  </div>
</div>

<!-- Write and Pages -->
<div class="toolbar only-author" role="toolbar" aria-label="Editing tools">
  <div class="tbgroup" role="group" aria-labelledby="agHistLbl">
    <div class="tbrow">
      <button type="button" class="tb" id="undoBtn" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5L3 9l4 4"/><path d="M3 9h9a5 5 0 0 1 0 10h-2"/></svg>Undo</button>
      <button type="button" class="tb" id="redoBtn" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 5l4 4-4 4"/><path d="M17 9H8a5 5 0 0 0 0 10h2"/></svg>Redo</button>
    </div>
    <span class="tblabel" id="agHistLbl">History</span>
  </div>
  <div class="tbgroup" role="group" aria-labelledby="agInsLbl">
    <div class="tbrow">
      <span class="insw split" draggable="true" data-drag-insert="heading"><span class="grip" aria-hidden="true">⠿</span><button type="button" class="ins" data-insert="heading">Heading</button>
        <label for="insLevel" class="sr-only">Level for new headings</label>
        <select id="insLevel"><option value="2">H2</option><option value="1">H1</option><option value="3">H3</option><option value="4">H4</option><option value="5">H5</option><option value="6">H6</option></select></span>
      <span class="insw" draggable="true" data-drag-insert="paragraph"><span class="grip" aria-hidden="true">⠿</span><button type="button" class="ins" data-insert="paragraph">Paragraph</button></span>
      <span class="insw" draggable="true" data-drag-insert="list"><span class="grip" aria-hidden="true">⠿</span><button type="button" class="ins" data-insert="list">List</button></span>
      <span class="insw" draggable="true" data-drag-insert="image"><span class="grip" aria-hidden="true">⠿</span><button type="button" class="ins" data-insert="image">Image</button></span>
      <span class="insw" draggable="true" data-drag-insert="table"><span class="grip" aria-hidden="true">⠿</span><button type="button" class="ins" data-insert="table">Table</button></span>
      <span class="insw" draggable="true" data-drag-insert="pagebreak"><span class="grip" aria-hidden="true">⠿</span><button type="button" class="ins" data-insert="pagebreak">Page break</button></span>
    </div>
    <span class="tblabel" id="agInsLbl">Insert · drag onto the page, or select to add after the current block</span>
  </div>
  <div class="tbgroup" role="group" aria-labelledby="agTextLbl">
    <div class="tbrow">
      <label for="tbFont" class="sr-only">Font</label>
      <select id="tbFont" class="tbselect"></select>
      <label for="tbSize" class="sr-only">Size in points</label>
      <input id="tbSize" class="tbnum" type="number" min="7" max="72" step="0.5" inputmode="decimal">
      <button type="button" class="tgl tbtgl" id="tbBold" aria-pressed="false"><b>B</b><span class="sr-only">Bold</span></button>
      <button type="button" class="tgl tbtgl" id="tbItalic" aria-pressed="false"><i>I</i><span class="sr-only">Italic</span></button>
    </div>
    <span class="tblabel" id="agTextLbl">Text</span>
  </div>
  <div class="tbgroup" role="group" aria-labelledby="agArrLbl">
    <div class="tbrow">
      <button type="button" class="tb" id="combineBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h12"/><path d="M4 16h12"/><path d="M10 6v8"/><path d="M7 11l3 3 3-3"/></svg>Combine</button>
      <button type="button" class="tb" id="moveUpBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4"/><path d="M5 9l5-5 5 5"/></svg>Move up</button>
      <button type="button" class="tb" id="moveDownBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12"/><path d="M5 11l5 5 5-5"/></svg>Move down</button>
      <button type="button" class="tb" id="deleteBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12"/><path d="M8 6V4h4v2"/><path d="M6 6l1 10h6l1-10"/></svg>Delete</button>
    </div>
    <span class="tblabel" id="agArrLbl">Arrange</span>
  </div>
  <p class="selinfo tbend" id="selInfo" aria-live="polite"></p>
</div>
