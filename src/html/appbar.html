<header class="appbar">
  <div class="brand">
    <svg class="i" viewBox="0 0 28 28" width="26" height="26" aria-hidden="true" style="width:26px;height:26px;stroke-width:1.6"><path d="M6 3h11l5 5v17H6z"/><path d="M17 3v5h5"/><path d="M10 13h8"/><path d="M10 17h5"/><path d="M10 21h8"/></svg>
    <h1>Accessible PDF Editor</h1>
    <span class="phase">Test build 5</span>
  </div>
  <span class="filename" id="fileName">No file open</span>
  <span class="chipnote only-author" id="saveChip"></span>
  <div class="bar-actions">
    <button type="button" class="btn dark" id="newBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h7l3 3v11H5z"/><path d="M10 9v5M7.5 11.5h5"/></svg>New</button>
    <span class="btn dark file-btn">
      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h3.6l1.8 2h5.6A1.5 1.5 0 0 1 17 8.5v6a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z"/></svg>
      <span aria-hidden="true">Open</span>
      <input type="file" id="fileInput" accept="application/pdf,.pdf,.pwj,application/json,.json" aria-label="Open a PDF or a .pwj draft">
    </span>
    <button type="button" class="btn dark only-audit" id="sampleBtn">Open sample PDF</button>
    <button type="button" class="btn dark only-audit" id="backToEdit" hidden>Back to editing</button>
    <button type="button" class="btn primary only-audit" id="reportBtn" disabled>Accessibility report</button>
    <button type="button" class="btn dark only-author" id="saveDraftBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h9.5L16 6.5V16H4z"/><path d="M7 4v4h6V4"/><path d="M7 16v-5h6v5"/></svg>Save draft</button>
    <button type="button" class="btn primary only-author" id="exportBtn"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10"/><path d="M6 7l4-4 4 4"/><path d="M4 13v3h12v-3"/></svg>Check &amp; export PDF</button>
  </div>
</header>

<div class="toolbar only-audit" role="toolbar" aria-label="View controls">
  <div class="tgroup">
    <button type="button" class="iconbtn" id="prevPage" aria-label="Previous page" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 6l-4 4 4 4"/></svg></button>
    <span class="num" id="pageLabel" aria-live="polite">Page – of –</span>
    <button type="button" class="iconbtn" id="nextPage" aria-label="Next page" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 6l4 4-4 4"/></svg></button>
  </div>
  <div class="tgroup">
    <button type="button" class="iconbtn" id="zoomOut" aria-label="Zoom out" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg></button>
    <span class="num" id="zoomLabel" style="min-width:48px;text-align:center">100%</span>
    <button type="button" class="iconbtn" id="zoomIn" aria-label="Zoom in" disabled><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/><path d="M10 5v10"/></svg></button>
    <button type="button" class="btn link" id="zoomFit" disabled>Fit width</button>
  </div>
  <label class="check"><input type="checkbox" id="showTags" checked> <span>Show tags</span></label>
  <label class="check"><input type="checkbox" id="showOrder" checked> <span>Show reading order</span></label>
  <label class="check"><input type="checkbox" id="showUntagged" checked> <span>Show untagged content</span></label>
</div>

<div class="toolbar only-author" role="toolbar" aria-label="Insert">
  <div class="viewseg" role="group" aria-label="View"><button type="button" id="viewWrite" aria-pressed="true">Write</button><button type="button" id="viewPages" aria-pressed="false">Pages</button></div>
  <span class="tsep" aria-hidden="true"></span>
  <span class="tlabel" aria-hidden="true">Insert</span>
  <div class="split">
    <button type="button" class="ins" data-insert="heading"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4v12M12 4v12M4 10h8"/><path d="M15 9l2-1v8"/></svg>Heading</button>
    <label for="insLevel" class="sr-only">Level for new headings</label>
    <select id="insLevel"><option value="2">H2</option><option value="1">H1</option><option value="3">H3</option><option value="4">H4</option><option value="5">H5</option><option value="6">H6</option></select>
  </div>
  <button type="button" class="ins" data-insert="paragraph"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 9h12M4 13h12M4 17h7"/></svg>Paragraph</button>
  <button type="button" class="ins" data-insert="list"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 5h9M8 10h9M8 15h9"/><path d="M4 5h.1M4 10h.1M4 15h.1"/></svg>List</button>
  <button type="button" class="ins" data-insert="image"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="1.5"/><circle cx="7.5" cy="8.5" r="1.5"/><path d="M3.5 14.5l4-4 3 3 2-2 4 4"/></svg>Image</button>
  <button type="button" class="ins" data-insert="table"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="1"/><path d="M3 8h14M3 12h14M8 4v12"/></svg>Table</button>
  <button type="button" class="ins" data-insert="pagebreak"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h3M8 10h4M14 10h3"/><path d="M5 4h10v3M5 16h10v-3"/></svg>Page break</button>
</div>
